[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-socket"
markers = ["video: requires the isolated MoviePy environment"]
filterwarnings = ["error::DeprecationWarning:pyprogs.*"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv*"]

[tool.ruff.lint]
# Catch broken names, unsafe exception handling, removed APIs and unused imports.
select = ["E4", "E7", "E9", "F", "UP"]

