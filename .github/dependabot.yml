
version: 2

updates:
  # Include every per-script manifest and the aggregate development environment.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/pyprogs"
      - "/pyprogs/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Toronto"
    target-branch: "main"
    open-pull-requests-limit: 5
    groups:
      compatible-python-updates:
        update-types: ["minor", "patch"]

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Toronto"
    target-branch: "main"
    open-pull-requests-limit: 5
    groups:
      compatible-action-updates:
        update-types: ["minor", "patch"]
