
name: Python Dependency Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: python-dependencies-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHON_DOTENV_DISABLED: "1"
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.14"
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyprogs/**/requirements.txt
            pyprogs/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check dependency metadata
        run: python -m pip check

      - name: Ruff static compatibility checks
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        run: python -m ruff check pyprogs tests tools

      - name: Imports and functional regressions (network blocked)
        run: python -m pytest -q --junitxml=test-results-core.xml

      - name: Audit installed dependencies
        run: python -m pip_audit --progress-spinner off
